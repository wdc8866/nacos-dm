name: Build & Push to GHCR (Multi-arch)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nacos-dm
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 导出双架构 tar 并上传到 Release ----
      - name: Install crane (Linux)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz | tar -xz -C /tmp crane
          chmod +x /tmp/crane
          export PATH="/tmp:$PATH"
          crane version

      - name: Pull arm64 tar
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          export PATH="/tmp:$PATH"
          crane pull --platform=linux/arm64 "${{ steps.meta.outputs.tags }}" nacos-dm-arm64.tar

      - name: Pull amd64 tar
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          export PATH="/tmp:$PATH"
          crane pull --platform=linux/amd64 "${{ steps.meta.outputs.tags }}" nacos-dm-amd64.tar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Nacos-DM ${{ github.ref_name }}
          body: "Nacos 3.2.4 + 达梦 DM 数据源插件\n\n- 架构: linux/amd64, linux/arm64\n- 镜像: ghcr.io/${{ github.repository_owner }}/nacos-dm\n- 插件: nacos-dm-datasource-plugin-ext\n- 驱动: DmJdbcDriver18 8.1.3.62\n- 注意: DM 需使用 MySQL 兼容模式 (COMPATIBLE_MODE=4)\n\n附件:\n- nacos-dm-arm64.tar\n- nacos-dm-amd64.tar"
          files: |
            nacos-dm-arm64.tar
            nacos-dm-amd64.tar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
